<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | SmartPantry</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/app.js" defer></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="SmartPantry home"><span class="brand-mark" aria-hidden="true">S</span>SmartPantry</a>
    <a class="text-link" href="login.html">Log in <span aria-hidden="true">&rarr;</span></a>
  </header>
  <main class="auth-layout" id="main-content">
    <section class="auth-aside">
      <p class="eyebrow">A better kitchen routine</p>
      <h1>Less waste. More good meals.</h1>
      <p>Create your account to keep the food you have and the meals you’re planning in one easy place.</p>
    </section>
    <section class="auth-panel" aria-labelledby="form-title">
      <p class="eyebrow">Get started</p>
      <h2 id="form-title">Create an account</h2>
      <form data-auth-form="register">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="80">
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password <span class="field-hint">At least 8 characters</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button class="button button-full" type="submit">Create account</button>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a class="text-link" href="login.html">Log in</a></p>
    </section>
  </main>
  <footer class="minimal-footer"><a href="index.html">SmartPantry</a></footer>
</body>
</html>
